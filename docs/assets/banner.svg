<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="dot" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#0d0d16"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dot)"/>
  <rect x="0" y="0" width="4" height="320" fill="url(#acc)"/>
  <!-- article feed mockup (right) -->
  <g opacity="0.22" transform="translate(830,46)">
    <!-- article 1 -->
    <rect x="0" y="0" width="380" height="60" rx="8" fill="#0a0a14" stroke="#6366f1" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#6366f1"/>
    <text x="16" y="18" font-family="monospace" font-size="10" fill="#818cf8">AI · 2 min ago</text>
    <text x="16" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">OpenAI Releases GPT-5 with...</text>
    <text x="16" y="50" font-family="monospace" font-size="10" fill="#6b7280">AI-generated · SEO optimized · Blogger</text>
    <!-- article 2 -->
    <rect x="0" y="68" width="380" height="60" rx="8" fill="#0a0a14" stroke="#a855f7" stroke-width="1"/>
    <rect x="0" y="68" width="4" height="60" rx="2" fill="#a855f7"/>
    <text x="16" y="86" font-family="monospace" font-size="10" fill="#c084fc">Cloud · 5 min ago</text>
    <text x="16" y="102" font-family="sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">AWS Launches New Region in...</text>
    <text x="16" y="118" font-family="monospace" font-size="10" fill="#6b7280">Auto-published · GitHub Actions</text>
    <!-- article 3 -->
    <rect x="0" y="136" width="380" height="60" rx="8" fill="#0a0a14" stroke="#3b82f6" stroke-width="1"/>
    <rect x="0" y="136" width="4" height="60" rx="2" fill="#3b82f6"/>
    <text x="16" y="154" font-family="monospace" font-size="10" fill="#93c5fd">Security · 10 min ago</text>
    <text x="16" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">Critical Vulnerability Found in...</text>
    <text x="16" y="186" font-family="monospace" font-size="10" fill="#6b7280">Zero manual effort · AdSense ready</text>
    <!-- pipeline badge -->
    <rect x="0" y="204" width="380" height="24" rx="12" fill="#6366f1" opacity="0.15"/>
    <circle cx="18" cy="216" r="5" fill="#22c55e"/>
    <text x="30" y="221" font-family="monospace" font-size="12" fill="#86efac">GitHub Actions pipeline: running — next publish in 23m</text>
  </g>
  <!-- logo: newspaper + bot mark -->
  <g transform="translate(80,84)" filter="url(#glow)">
    <rect x="0" y="0" width="116" height="116" rx="18" fill="#050508" stroke="url(#acc)" stroke-width="3"/>
    <!-- newspaper body -->
    <rect x="14" y="20" width="88" height="76" rx="6" fill="none" stroke="url(#acc)" stroke-width="3"/>
    <!-- headline lines -->
    <rect x="22" y="30" width="72" height="6" rx="3" fill="url(#acc)" opacity="0.8"/>
    <rect x="22" y="42" width="54" height="4" rx="2" fill="#6b7280" opacity="0.6"/>
    <rect x="22" y="52" width="60" height="4" rx="2" fill="#6b7280" opacity="0.5"/>
    <rect x="22" y="62" width="48" height="4" rx="2" fill="#6b7280" opacity="0.4"/>
    <!-- robot head badge -->
    <rect x="62" y="68" width="36" height="28" rx="8" fill="#6366f1"/>
    <circle cx="74" cy="79" r="3" fill="#fff"/>
    <circle cx="86" cy="79" r="3" fill="#fff"/>
    <rect x="69" y="86" width="22" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
  </g>
  <!-- wordmark -->
  <text x="222" y="95" font-family="'SF Mono',Consolas,monospace" font-size="13" fill="#818cf8" opacity="0.6" letter-spacing="4">AI-POWERED CONTENT PLATFORM</text>
  <text x="218" y="163" font-family="Arial Black,'Arial Bold',sans-serif" font-size="58" font-weight="900" letter-spacing="-1" fill="#f0f0ff">Tech News</text>
  <text x="218" y="208" font-family="Arial Black,'Arial Bold',sans-serif" font-size="58" font-weight="900" letter-spacing="-1" fill="url(#acc)">Platform</text>
  <rect x="220" y="224" width="500" height="2" fill="url(#acc)" opacity="0.45"/>
  <!-- feature pills -->
  <rect x="222" y="240" width="120" height="26" rx="13" fill="#6366f1" opacity="0.18"/>
  <text x="282" y="258" font-family="monospace" font-size="12" fill="#a5b4fc" text-anchor="middle">100% Auto</text>
  <rect x="354" y="240" width="130" height="26" rx="13" fill="#a855f7" opacity="0.18"/>
  <text x="419" y="258" font-family="monospace" font-size="12" fill="#d8b4fe" text-anchor="middle">AI Editorial</text>
  <rect x="496" y="240" width="130" height="26" rx="13" fill="#3b82f6" opacity="0.18"/>
  <text x="561" y="258" font-family="monospace" font-size="12" fill="#93c5fd" text-anchor="middle">AdSense Ready</text>
  <text x="222" y="296" font-family="monospace" font-size="12" fill="#6b7280">Python · GitHub Actions · Blogger API · Vercel · SEO Optimized</text>
</svg>